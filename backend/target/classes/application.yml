server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/xclaw;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: xclaw-platform-jwt-secret-key-2026-must-be-at-least-256-bits-long
  expiration: 86400000

xclaw:
  host: localhost
  # 是否允许远程访问。设为 true 时 OpenClaw 实例将监听 0.0.0.0（所有网络接口），
  # 同时需将 xclaw.host 配置为外部可访问的 IP/主机名
  remote-access: false

openclaw:
  backend:
    url: https://api.deepseek.com
    api-key: ${OPENCLAW_LLM_API_KEY:sk-2327f09ead3e4606b4b55987829bd9aa}
    model: deepseek-v4-flash
  runtime: /usr/lib/node_modules/openclaw/dist/index.js
  instance-dir: /root/.openclaw-instances
