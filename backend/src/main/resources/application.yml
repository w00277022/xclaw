server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/xclaw;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:xclaw-platform-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

xclaw:
  host: ${XCLAW_HOST:172.16.10.224}
  remote-access: ${XCLAW_REMOTE_ACCESS:true}

openclaw:
  backend:
    url: ${OPENCLAW_BACKEND_URL:https://api.deepseek.com}
    api-key: ${OPENCLAW_LLM_API_KEY:sk-2327f09ead3e4606b4b55987829bd9aa}
    model: ${OPENCLAW_BACKEND_MODEL:deepseek-v4-flash}
  runtime: ${OPENCLAW_RUNTIME:/usr/lib/node_modules/openclaw/dist/index.js}
  instance-dir: ${OPENCLAW_INSTANCE_DIR:/root/.openclaw-instances}
